name: Import Toolora source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract project source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path.cwd()
          with ZipFile('Toolora-source.zip') as archive:
              for entry in archive.infolist():
                  parts = Path(entry.filename).parts
                  if not parts or parts[0] != 'Toolora' or len(parts) < 2:
                      continue
                  target = root.joinpath(*parts[1:]).resolve()
                  if not target.is_relative_to(root) or '.git' in target.relative_to(root).parts:
                      raise ValueError('Unsafe archive path')
                  if entry.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(entry))
          PY
      - run: python3 scripts/build.py && python3 scripts/check.py
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --cached --quiet || git commit -m 'Import and validate Toolora application source'
          git push
